services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: consumo-sostenible-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AI_API_URL: http://host.docker.internal:8077/upload-comment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

